<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Clipper for Super Productivity</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --bg-field: #fff;
        --text: #202124;
        --text-secondary: #555;
        --border: #c4c7c5;
        --accent: #1967d2;
        --accent-hover: #1557b0;
        --glow: rgba(25, 103, 210, .25);
        --shadow: rgba(0, 0, 0, .15);
        --star-off: #fff;
        --star-outline: #5f6368;
        --star-on: #ffc107;
        --ok: #188038;
        --err: #b3261e;
        --warn: #a35a00;
        --scroll-thumb: rgba(25, 103, 210, .4);
        --scroll-track: rgba(25, 103, 210, .05);
      }
      :root.dark {
        color-scheme: dark;
        --bg: #1e1e1e;
        --bg-field: #2a2a2a;
        --text: #e0e0e0;
        --text-secondary: #b0b0b0;
        --border: #555;
        --accent: #4d8ef7;
        --accent-hover: #6aa1fa;
        --glow: rgba(77, 142, 247, .4);
        --shadow: rgba(0, 0, 0, .5);
        --star-off: #333;
        --star-outline: #aaa;
        --ok: #6dd58c;
        --err: #f2b8b5;
        --warn: #ffb95c;
        --scroll-thumb: rgba(77, 142, 247, .6);
        --scroll-track: rgba(77, 142, 247, .1);
      }

      body {
        width: 600px; margin: 0; padding: 12px;
        box-sizing: border-box;
        font: 14px 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: var(--text); background: var(--bg);
      }
      label { font-weight: 500; color: var(--text-secondary); margin-right: 6px; white-space: nowrap; }
      input[type="text"], input[type="date"], select, textarea {
        box-sizing: border-box; padding: 7px 9px; font: inherit;
        color: var(--text); background: var(--bg-field);
        border: 1px solid var(--border); border-radius: 4px;
      }
      input:focus, select:focus, textarea:focus, button:focus-visible {
        outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px var(--glow);
      }

      .row { display: flex; align-items: center; margin-bottom: 8px; }
      .top-row { justify-content: space-between; margin-top: 16px; }

      /* Enlarge the Project label's hit area so focusing the dropdown is easy,
         without shifting layout. Bottom stays short of the star row below. */
      label[for="project"] { position: relative; cursor: pointer; }
      label[for="project"]::after {
        content: ""; position: absolute;
        top: -16px; bottom: -12px; left: -12px; right: -7px;
      }

      /* Project dropdown with type-to-search */
      .smart-search-wrapper { position: relative; display: inline-block; }
      #project { min-width: 260px; max-width: 380px; }
      #search-buffer-display {
        position: absolute; bottom: 100%; left: 0; z-index: 10;
        padding: 1px 8px; border-radius: 4px 4px 0 0;
        background: var(--accent); color: #fff; font-size: .85em; font-weight: bold;
        white-space: nowrap;
      }
      #smart-search-results {
        position: absolute; top: 100%; left: 0; z-index: 10;
        width: 100%; min-width: 260px; box-sizing: border-box;
        max-height: 250px; overflow-y: auto; margin: 0; padding: 0; list-style: none;
        background: var(--bg-field); border: 1px solid var(--border); border-radius: 0 0 4px 4px;
        box-shadow: 0 4px 6px var(--shadow);
      }
      #smart-search-results[hidden], #search-buffer-display[hidden] { display: none; }
      #smart-search-results li {
        padding: 7px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
      }
      #smart-search-results li:last-child { border-bottom: none; }
      #smart-search-results li.highlighted, #smart-search-results li:hover { background: var(--accent); color: #fff; }
      #smart-search-results li.empty { cursor: default; font-style: italic; color: var(--text-secondary); }
      #smart-search-results li.empty:hover { background: none; }
      #smart-search-results::-webkit-scrollbar { width: 20px; }
      #smart-search-results::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 6px; }
      #smart-search-results::-webkit-scrollbar-track { background: var(--scroll-track); }

      #theme-toggle {
        padding: 4px 9px; cursor: pointer; font: inherit; font-size: 13px;
        color: var(--text); background: var(--bg-field);
        border: 1px solid var(--border); border-radius: 4px;
      }
      #theme-toggle:hover { background: var(--border); }

      /* Star toggle (High priority) */
      #star {
        flex-shrink: 0; width: 30px; height: 30px; margin-right: 6px; padding: 2px;
        border: 1px solid transparent; border-radius: 4px; background: none; cursor: pointer;
      }
      #star svg { display: block; width: 24px; height: 24px; transition: transform .1s ease-in-out; }
      #star:active svg { transform: scale(.85); }
      #star path { fill: var(--star-off); stroke: var(--star-outline); stroke-width: 1.5; stroke-linejoin: round; }
      #star[aria-pressed="true"] path { fill: var(--star-on); stroke: var(--star-on); }

      #title { flex: 1 1 auto; min-width: 0; }
      .date-label { margin-left: 12px; }
      #deadline { flex-shrink: 0; width: 140px; }

      #note {
        display: block; width: 100%; height: 170px; resize: vertical; padding: 9px;
      }

      .actions { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
      .actions button {
        padding: 7px 16px; border-radius: 4px; cursor: pointer; font: inherit; font-weight: 500;
      }
      #add { color: #fff; background: var(--accent); border: 1px solid transparent; }
      #add:hover { background: var(--accent-hover); }
      #add-close { color: var(--text); background: var(--bg-field); border: 1px solid var(--border); }
      #add-close:hover { background: var(--border); }
      .actions button:disabled { opacity: .6; cursor: wait; }
      #status { flex: 1; margin-left: 6px; white-space: pre-wrap; }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--err); }
      #status.warn { color: var(--warn); }
    </style>
  </head>
  <body>
    <div class="row top-row">
      <div class="row" style="margin: 0">
        <label for="project">Project:</label>
        <div class="smart-search-wrapper">
          <div id="search-buffer-display" hidden></div>
          <select id="project">
            <option value="INBOX_PROJECT">Inbox</option>
          </select>
          <ul id="smart-search-results" role="listbox" aria-label="Matching projects" hidden></ul>
        </div>
      </div>
      <button id="theme-toggle" type="button" title="Switch between light and dark">🌓 Theme</button>
    </div>

    <div class="row">
      <button id="star" type="button" aria-pressed="false" title="High priority" aria-label="High priority">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2.5l2.94 5.96 6.56.95-4.75 4.63 1.12 6.54L12 17.5l-5.87 3.08 1.12-6.54L2.5 9.41l6.56-.95z"/>
        </svg>
      </button>
      <label for="title">Title:</label>
      <input id="title" type="text" maxlength="500" autocomplete="off">
      <label for="deadline" class="date-label">Deadline:</label>
      <input id="deadline" type="date">
    </div>

    <textarea id="note" aria-label="Note"></textarea>

    <div class="actions">
      <button id="add" type="button" title="Add (Enter in the title)">Add</button>
      <button id="add-close" type="button" title="Add &amp; Close (Ctrl+Shift+Enter)">Add &amp; Close</button>
      <div id="status" role="status" aria-live="polite"></div>
    </div>

    <script src="smart-dropdown.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
