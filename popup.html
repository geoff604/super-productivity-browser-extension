<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add to Super Productivity</title>
    <style>
      body { width: 360px; margin: 0; padding: 10px 16px; font: 14px Arial, sans-serif; color: #202124; }
      h1 { margin: 0 0 6px; font-size: 16px; }
      label, legend { display: block; margin: 6px 0 3px; font-weight: 600; }
      input, textarea, select, button { box-sizing: border-box; width: 100%; font: inherit; }
      input, textarea, select { padding: 8px; border: 1px solid #9aa0a6; border-radius: 4px; }
      textarea { min-height: 52px; resize: vertical; }
      .url { overflow-wrap: anywhere; color: #5f6368; }
      fieldset { border: 0; padding: 0; margin: 6px 0; }
      .choice { display: flex; align-items: center; gap: 7px; font-weight: normal; margin: 2px 0; }
      .choice input { width: auto; }
      button { margin-top: 8px; padding: 9px; border: 0; border-radius: 4px; background: #1967d2; color: white; cursor: pointer; }
      button:disabled { opacity: .6; cursor: wait; }
      #status { min-height: 16px; margin-top: 4px; white-space: pre-wrap; }
      #tagChips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 4px; max-height: 76px; overflow-y: auto; }
      #tagChips:empty { display: none; }
      .chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 4px 3px 8px; background: #e8f0fe; color: #174ea6; border-radius: 12px; font-size: 12px; }
      .chip button { width: auto; margin: 0; padding: 0 6px; border: 0; background: transparent; color: inherit; font-size: 14px; line-height: 1; cursor: pointer; }
      .chip button:hover { background: #d2e3fc; }
      #tagSearch { margin-bottom: 4px; }
      #tagList { max-height: 96px; overflow-y: auto; border: 1px solid #9aa0a6; border-radius: 4px; padding: 4px 8px; }
    </style>
  </head>
  <body>
    <h1>Add to Super Productivity</h1>
    <label for="title">Task title</label>
    <input id="title" type="text" required>

    <div>
      <label>Page URL</label>
      <div id="url" class="url"></div>
    </div>

    <fieldset>
      <legend>Title source</legend>
      <label class="choice"><input type="radio" name="titleSource" value="page" checked> Page title</label>
      <label class="choice"><input type="radio" name="titleSource" value="selection" disabled> Selected text</label>
    </fieldset>

    <label for="selection">Selected text</label>
    <textarea id="selection" placeholder="No selected text available"></textarea>

    <label for="project">Project</label>
    <select id="project">
      <option value="">No project</option>
    </select>

    <fieldset>
      <legend>Tags</legend>
      <div id="tagChips"></div>
      <input id="tagSearch" type="text" placeholder="Filter tags" autocomplete="off">
      <div id="tagList"></div>
    </fieldset>

    <button id="submit" type="button">Add to Super Productivity</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
